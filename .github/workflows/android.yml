name: Build and verify Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', 'scripts/**', 'docs/assets.sha256.json', 'docs/THIRD_PARTY.md', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional new release version, for example v1.0.1 (run on main)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate requested release version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, re
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Publish releases from main.")
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]):
              raise SystemExit("Use a new version in the form v1.0.1.")
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          # The action default includes the retired SDK package "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Build, test, lint and verify bundled assets
        run: python scripts/build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: AssistiveVision-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-validation-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: ignore

  publish-release:
    needs: debug-apk
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AssistiveVision-debug-${{ github.sha }}
          path: dist/
      - name: Verify downloaded package identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          package = Path("dist")
          manifest = json.loads((package / "build-manifest.json").read_text())
          if manifest["source_commit"] != os.environ["GITHUB_SHA"] or manifest["source_worktree_changed"]:
              raise SystemExit("The APK must come from this clean main revision.")
          apk = package / "AssistiveVision-1.0-debug.apk"
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if manifest["apk"]["file"] != apk.name or digest != manifest["apk"]["sha256"]:
              raise SystemExit("APK checksum does not match its build manifest.")
          if (package / "SHA256SUMS").read_text().split() != [digest, apk.name]:
              raise SystemExit("SHA256SUMS does not identify this APK.")
          PY
      - name: Publish versioned APK and verification files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "AssistiveVision $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md \
            --latest

name: Build and verify Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', 'scripts/**', 'docs/assets.sha256.json', 'docs/THIRD_PARTY.md', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Build, test, lint and verify bundled assets
        run: python scripts/build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: AssistiveVision-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-validation-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: ignore
